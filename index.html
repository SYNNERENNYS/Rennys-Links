<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redirecting...</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
}

#app {
    width: 100%;
    min-height: 100vh;
}

.screen {
    min-height: 100vh;
    width: 100%;
}

.small-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.muted {
    opacity: 0.55;
}


/* =========================================================
   REDIRECT TRANSITION
========================================================= */

#transitionOverlay {
    position: fixed;
    inset: 0;

    background: #080808;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: white;

    z-index: 9999;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.12s ease,
        visibility 0.12s ease;
}

#transitionOverlay.active {
    opacity: 1;
    visibility: visible;
}

.transitionText {
    margin-top: 22px;

    font-family:
        Arial,
        sans-serif;

    font-size: 12px;

    letter-spacing: 3px;

    opacity: 0.55;
}


/* =========================================================
   STICKER EASTER EGG
========================================================= */

.sticker-slot {
    display: none;

    margin-bottom: 24px;

    align-items: center;
    justify-content: center;
}

.sticker-slot.show {
    display: flex;
}

.sticker-slot img {
    width: auto;
    height: auto;

    max-width: min(190px, 45vw);
    max-height: min(190px, 30vh);

    object-fit: contain;

    opacity: 0;

    transform:
        scale(.4)
        rotate(-10deg);

    animation:
        stickerPop .42s
        cubic-bezier(.2, 1.6, .4, 1)
        forwards;
}

@keyframes stickerPop {

    0% {
        opacity: 0;

        transform:
            scale(.3)
            rotate(-15deg);
    }

    65% {
        opacity: 1;

        transform:
            scale(1.12)
            rotate(4deg);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/* =========================================================
   TRANSITION ICONS
========================================================= */

.icon-spinner {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,.15);

    border-top-color: white;

    animation:
        spin .55s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


.icon-dots {
    display: flex;
    gap: 8px;
}

.icon-dots span {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: white;

    animation:
        dotPulse .65s infinite alternate;
}

.icon-dots span:nth-child(2) {
    animation-delay: .13s;
}

.icon-dots span:nth-child(3) {
    animation-delay: .26s;
}

@keyframes dotPulse {

    from {
        opacity: .2;
        transform: translateY(0);
    }

    to {
        opacity: 1;
        transform: translateY(-9px);
    }
}


.icon-squares {
    display: grid;

    grid-template-columns:
        repeat(2, 15px);

    gap: 5px;
}

.icon-squares span {
    width: 15px;
    height: 15px;

    background: white;

    animation:
        squarePulse .8s infinite;
}

.icon-squares span:nth-child(2) {
    animation-delay: .15s;
}

.icon-squares span:nth-child(3) {
    animation-delay: .30s;
}

.icon-squares span:nth-child(4) {
    animation-delay: .45s;
}

@keyframes squarePulse {

    0%,
    100% {
        opacity: .15;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   01 CORPORATE
========================================================= */

.corporate-screen {
    background: #edf2f7;

    color: #18212b;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.corp-header {
    height: 70px;

    background: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6vw;

    border-bottom:
        1px solid #d6dde5;
}

.corp-logo {
    font-size: 19px;
    font-weight: bold;
}

.corp-nav {
    font-size: 12px;

    color: #6e7883;
}

.corp-main {
    min-height:
        calc(100vh - 70px);

    display: grid;
    place-items: center;

    padding: 35px 20px;
}

.corp-card {
    width:
        min(620px, 92vw);

    background: white;

    padding: 42px;

    border-radius: 10px;

    box-shadow:
        0 16px 45px
        rgba(20,35,50,.09);
}

.corp-status {
    color: #3171e0;

    font-weight: bold;

    font-size: 12px;

    letter-spacing: 1px;
}

.corp-card h1 {
    margin: 12px 0 4px;

    font-size: 32px;
}

.corp-card h2 {
    margin: 0;

    font-size: 15px;

    font-weight: normal;

    color: #708090;
}

.segment-loader {
    margin-top: 35px;

    display: grid;

    grid-template-columns:
        repeat(10, 1fr);

    gap: 5px;
}

.segment-loader span {
    height: 11px;

    background: #e5eaf0;

    border-radius: 3px;

    transition:
        background .16s;
}

.segment-loader span.active {
    background: #3171e0;
}

.corp-bottom {
    margin-top: 14px;

    display: flex;
    justify-content: space-between;

    font-size: 12px;

    color: #7d8791;
}


/* =========================================================
   02 TERMINAL
========================================================= */

.terminal-screen {
    background: #030603;

    color: #69ff81;

    font-family:
        "Courier New",
        monospace;

    padding: 5vw;

    display: flex;
    align-items: center;
}

.terminal-window {
    width:
        min(850px, 100%);

    border:
        1px solid #1b6f29;

    box-shadow:
        0 0 35px
        rgba(0,255,70,.06);
}

.terminal-top {
    padding: 10px 15px;

    border-bottom:
        1px solid #174f20;

    font-size: 12px;
}

.terminal-body {
    padding: 28px;

    min-height: 380px;
}

.terminal-line {
    margin: 8px 0;

    opacity: .8;

    font-size: 14px;
}

.terminal-title {
    margin: 30px 0 20px;

    font-size: 23px;
}

.ascii-progress {
    margin-top: 25px;

    white-space: pre;

    font-size: 15px;
}

.terminal-cursor {
    display: inline-block;

    width: 8px;
    height: 16px;

    background: #69ff81;

    margin-left: 5px;

    animation:
        cursorBlink .7s infinite;
}

@keyframes cursorBlink {
    50% {
        opacity: 0;
    }
}


/* =========================================================
   03 WARNING
========================================================= */

.warning-screen {
    background: #f8c400;

    color: #111;

    font-family:
        Impact,
        "Arial Narrow",
        sans-serif;

    display: grid;

    grid-template-columns:
        33% 67%;

    min-height: 100vh;
}

.warning-side {
    background: #111;

    color: #f8c400;

    display: flex;

    align-items: center;
    justify-content: center;

    writing-mode:
        vertical-rl;

    font-size:
        clamp(34px, 6vw, 74px);

    letter-spacing: 4px;
}

.warning-main {
    display: flex;

    flex-direction: column;

    justify-content: center;

    padding: 7vw;
}

.warning-code {
    font-family:
        "Courier New",
        monospace;

    font-size: 13px;

    margin-bottom: 20px;
}

.warning-main h1 {
    margin: 0;

    font-size:
        clamp(38px, 7vw, 80px);

    line-height: .95;
}

.warning-main h2 {
    font-family:
        Arial,
        sans-serif;

    font-size: 16px;

    margin-top: 22px;

    max-width: 450px;
}

.block-loader {
    display: flex;

    gap: 7px;

    margin-top: 35px;
}

.block-loader span {
    width: 28px;
    height: 35px;

    border:
        3px solid #111;

    transition:
        background .1s;
}

.block-loader span.active {
    background: #111;
}


/* =========================================================
   04 GLASS
========================================================= */

.glass-screen {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 10%,
            #845ef7,
            #3f2b96 35%,
            #0b1020 80%
        );

    color: white;

    font-family:
        "Segoe UI",
        sans-serif;

    display: grid;
    place-items: center;
}

.glass-card {
    width:
        min(560px, 88vw);

    padding: 52px 35px;

    border-radius: 30px;

    text-align: center;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.22);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 30px 70px
        rgba(0,0,0,.28);
}

.glass-card h1 {
    margin: 15px 0 4px;
}

.glass-card h2 {
    font-size: 14px;

    font-weight: normal;

    opacity: .55;

    margin: 0 0 28px;
}

.ring-loader {
    width: 145px;
    height: 145px;

    margin: 25px auto;

    border-radius: 50%;

    background:
        conic-gradient(
            white var(--ringAngle),
            rgba(255,255,255,.12) 0
        );

    display: grid;
    place-items: center;
}

.ring-inner {
    width: 118px;
    height: 118px;

    border-radius: 50%;

    background:
        rgba(20,17,55,.92);

    display: grid;
    place-items: center;

    font-size: 25px;
}


/* =========================================================
   05 PAPER
========================================================= */

.paper-screen {
    background: #d8cfbe;

    color: #2d2923;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    min-height: 100vh;

    padding: 50px 20px;

    display: grid;
    place-items: center;
}

.paper-document {
    width:
        min(720px, 92vw);

    min-height: 580px;

    background: #f9f3e7;

    box-shadow:
        10px 12px 0
        rgba(70,60,45,.15);

    padding: 55px;

    border:
        1px solid #c2b7a1;
}

.paper-id {
    font-family:
        "Courier New",
        monospace;

    font-size: 12px;
}

.paper-document h1 {
    font-weight: normal;

    font-size: 32px;

    margin: 45px 0 3px;
}

.paper-document h2 {
    font-weight: normal;

    font-size: 15px;

    margin: 0;

    opacity: .55;
}

.checklist {
    margin-top: 40px;
}

.check-row {
    display: flex;
    align-items: center;

    margin: 17px 0;

    font-family:
        Arial,
        sans-serif;

    font-size: 13px;
}

.check-box {
    width: 17px;
    height: 17px;

    border:
        1px solid #5d5549;

    margin-right: 12px;

    display: grid;
    place-items: center;
}

.check-row.done
.check-box::after {
    content: "✓";

    font-size: 13px;
}


/* =========================================================
   06 DASHBOARD
========================================================= */

.dashboard-screen {
    background: #10151b;

    color: #e6edf3;

    font-family:
        Arial,
        sans-serif;

    min-height: 100vh;

    display: grid;

    grid-template-columns:
        230px 1fr;
}

.dash-sidebar {
    background: #0a0e12;

    padding: 35px 25px;

    border-right:
        1px solid #26303a;
}

.dash-logo {
    font-size: 18px;
    font-weight: bold;

    margin-bottom: 50px;
}

.dash-menu div {
    margin: 18px 0;

    font-size: 12px;

    color: #6e7984;
}

.active-menu {
    color: #58a6ff !important;
}

.dash-content {
    padding: 6vw;
}

.dash-content h1 {
    font-size: 29px;

    margin-bottom: 6px;
}

.dash-content h2 {
    margin: 0;

    font-size: 14px;

    font-weight: normal;

    color: #7d8790;
}

.node-grid {
    margin-top: 45px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(150px,260px));

    gap: 15px;
}

.node-card {
    padding: 20px;

    border:
        1px solid #27313b;

    background: #151b22;
}

.node-light {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #39424b;

    margin-bottom: 15px;
}

.node-card.online
.node-light {
    background: #3fb950;

    box-shadow:
        0 0 10px
        rgba(63,185,80,.5);
}

.node-name {
    font-size: 13px;

    font-weight: bold;
}

.node-state {
    margin-top: 6px;

    font-size: 11px;

    color: #77818b;
}


/* =========================================================
   07 ERROR
========================================================= */

.error-screen {
    min-height: 100vh;

    background: #fafafa;

    color: #1d1d1d;

    font-family:
        Arial,
        sans-serif;

    display: flex;

    align-items: center;

    padding: 8vw;
}

.error-code {
    font-size:
        clamp(110px, 22vw, 260px);

    font-weight: 900;

    line-height: .75;

    color: #e9e9e9;

    position: absolute;

    right: 4vw;

    z-index: 0;
}

.error-content {
    width:
        min(560px, 90vw);

    position: relative;

    z-index: 1;
}

.error-content h1 {
    font-size:
        clamp(35px, 6vw, 65px);

    margin-bottom: 5px;
}

.error-content h2 {
    font-size: 14px;

    font-weight: normal;

    color: #777;

    margin-top: 0;
}

.reconnect-loader {
    margin-top: 35px;

    display: flex;

    gap: 4px;

    align-items: flex-end;

    height: 45px;
}

.reconnect-loader span {
    width: 8px;

    background: #111;

    opacity: .15;
}

.reconnect-loader span.active {
    opacity: 1;
}


/* =========================================================
   08 MOBILE
========================================================= */

.mobile-screen {
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #e8e3ff,
            #d6f2ff
        );

    display: grid;
    place-items: center;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: #332f45;
}

.phone {
    width:
        min(360px, 84vw);

    height: 650px;

    max-height: 86vh;

    background: #fff;

    border-radius: 36px;

    padding: 17px;

    box-shadow:
        0 30px 80px
        rgba(50,40,90,.22);
}

.phone-screen {
    height: 100%;

    background:
        linear-gradient(
            180deg,
            #f9f8ff,
            #fff
        );

    border-radius: 25px;

    display: flex;

    flex-direction: column;

    padding: 28px;
}

.phone-top {
    font-size: 10px;

    display: flex;

    justify-content: space-between;
}

.app-icon {
    width: 65px;
    height: 65px;

    border-radius: 20px;

    margin:
        auto auto 20px;

    background:
        linear-gradient(
            135deg,
            #745cff,
            #42b9ff
        );

    display: grid;

    place-items: center;

    color: white;

    font-size: 28px;
}

.phone-message {
    text-align: center;

    margin-bottom: auto;
}

.phone-message h1 {
    font-size: 22px;

    margin-bottom: 5px;
}

.phone-message h2 {
    font-size: 12px;

    font-weight: normal;

    opacity: .55;
}

.dot-loader {
    display: flex;

    justify-content: center;

    gap: 9px;

    margin: 25px 0 55px;
}

.dot-loader span {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #d4d0e4;
}

.dot-loader span.active {
    background: #6658d9;

    transform:
        scale(1.3);
}


/* =========================================================
   09 AIRPORT
========================================================= */

.airport-screen {
    min-height: 100vh;

    background: #17202b;

    color: #f0c933;

    font-family:
        "Courier New",
        monospace;

    padding: 5vw;
}

.airport-header {
    display: flex;

    justify-content: space-between;

    padding-bottom: 20px;

    border-bottom:
        3px solid #f0c933;

    margin-bottom: 25px;
}

.airport-header h1 {
    margin: 0;

    font-family:
        Arial,
        sans-serif;
}

.airport-grid {
    width: 100%;

    border-collapse: collapse;

    font-size:
        clamp(12px,2vw,18px);
}

.airport-grid th {
    color: #86929e;

    text-align: left;

    font-size: 10px;

    padding: 12px;

    border-bottom:
        1px solid #394552;
}

.airport-grid td {
    padding: 18px 12px;

    border-bottom:
        1px solid #303b46;
}

.flight-active {
    background:
        rgba(240,201,51,.08);
}

.airport-progress {
    margin-top: 35px;

    height: 6px;

    background: #303b46;
}

.airport-progress div {
    height: 100%;

    width: 0;

    background: #f0c933;

    transition:
        width .15s;
}


/* =========================================================
   10 BIOS
========================================================= */

.bios-screen {
    min-height: 100vh;

    background: #0000aa;

    color: white;

    font-family:
        "Courier New",
        monospace;

    padding: 35px;

    font-size:
        clamp(12px,2vw,16px);
}

.bios-title {
    text-align: center;

    margin-bottom: 35px;

    font-size: 20px;
}

.bios-line {
    margin: 8px 0;
}

.bios-spacer {
    height: 35px;
}

.bios-progress {
    margin-top: 25px;

    white-space: pre-wrap;
}


/* =========================================================
   11 RADAR
========================================================= */

.radar-screen {
    min-height: 100vh;

    background:
        radial-gradient(
            circle,
            #062516,
            #020b06 70%
        );

    color: #46ff94;

    font-family:
        "Courier New",
        monospace;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    align-items: center;

    padding: 6vw;
}

.radar-circle {
    width:
        min(420px,42vw);

    aspect-ratio: 1;

    border-radius: 50%;

    border:
        1px solid #197444;

    position: relative;

    background:

        linear-gradient(
            transparent 49.5%,
            #17653d 50%,
            transparent 50.5%
        ),

        linear-gradient(
            90deg,
            transparent 49.5%,
            #17653d 50%,
            transparent 50.5%
        ),

        radial-gradient(
            circle,
            transparent 24%,
            #17653d 25%,
            transparent 25.5%,
            transparent 49%,
            #17653d 50%,
            transparent 50.5%,
            transparent 74%,
            #17653d 75%,
            transparent 75.5%
        );
}

.radar-beam {
    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(
            rgba(70,255,148,.45),
            transparent 18%
        );

    animation:
        radarSpin 1.5s linear infinite;
}

@keyframes radarSpin {
    to {
        transform: rotate(360deg);
    }
}

.radar-info h1 {
    font-size:
        clamp(25px,4vw,50px);

    margin-bottom: 5px;
}

.radar-info h2 {
    font-weight: normal;

    font-size: 14px;

    opacity: .55;
}

.radar-percent {
    margin-top: 35px;

    font-size: 45px;
}


/* =========================================================
   12 QUEUE
========================================================= */

.queue-screen {
    min-height: 100vh;

    background: #f7f7fb;

    color: #25252d;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    padding: 6vw;
}

.queue-header {
    max-width: 750px;
}

.queue-header h1 {
    font-size:
        clamp(30px,5vw,55px);

    margin-bottom: 3px;
}

.queue-header h2 {
    margin-top: 0;

    font-size: 14px;

    font-weight: normal;

    color: #888;
}

.queue-cards {
    display: flex;

    gap: 15px;

    margin-top: 45px;

    overflow: hidden;
}

.queue-card {
    min-width: 180px;

    padding: 22px;

    background: white;

    border:
        1px solid #e6e6ed;

    border-radius: 14px;

    box-shadow:
        0 10px 25px
        rgba(30,30,50,.05);

    opacity: .3;
}

.queue-card.active {
    opacity: 1;

    border-color: #6c61e8;
}

.queue-card strong {
    display: block;

    margin-bottom: 10px;
}

.queue-meter {
    margin-top: 45px;

    height: 4px;

    background: #e1e1e8;
}

.queue-meter div {
    width: 0;

    height: 100%;

    background: #6c61e8;

    transition:
        width .15s;
}


/* =========================================================
   FINAL
========================================================= */

.final-screen {
    min-height: 100vh;

    display: grid;

    place-items: center;

    text-align: center;

    background: white;

    color: #111;

    font-family:
        Helvetica,
        Arial,
        sans-serif;
}

.final-screen h1 {
    font-size:
        clamp(35px,7vw,72px);

    font-weight: 300;

    margin: 0 0 10px;
}

.final-screen p {
    color: #888;
}


/* =========================================================
   MOBILE RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .warning-screen {
        grid-template-columns:
            75px 1fr;
    }

    .dashboard-screen {
        grid-template-columns:
            1fr;
    }

    .dash-sidebar {
        display: none;
    }

    .radar-screen {
        grid-template-columns:
            1fr;

        text-align: center;

        gap: 30px;
    }

    .radar-circle {
        width:
            min(300px,75vw);

        margin: auto;
    }

/* =========================================================

/* =========================================================
   UTILITY
========================================================= */

function random(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


function pick(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function shuffle(array) {

    const result =
        [...array];


    for (
        let i =
            result.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }


    return result;

}


/* =========================================================
   STICKERS
========================================================= */

function getRandomSticker() {

    let number;


    if (
        STICKER_COUNT <= 1
    ) {

        number = 1;

    }

    else {

        do {

            number =
                random(
                    1,
                    STICKER_COUNT
                );

        }

        while (
            number ===
            lastStickerNumber
        );

    }


    lastStickerNumber =
        number;


    return (
        "stickers/sticker" +
        number +
        ".png"
    );

}


function preloadStickers() {

    for (
        let i = 1;

        i <= STICKER_COUNT;

        i++
    ) {

        const img =
            new Image();


        img.src =
            "stickers/sticker" +
            i +
            ".png";

    }

}


/* =========================================================
   ABSURDITY LEVEL
========================================================= */

/*
0 = 正常
1 = 微妙
2 = 很怪
3 = 完全失控
*/

function getAbsurdityLevel(stage) {

    const ratio =
        stage /
        TOTAL_STAGES;


    if (
        ratio <= .25
    ) {
        return 0;
    }


    if (
        ratio <= .50
    ) {
        return 1;
    }


    if (
        ratio <= .78
    ) {
        return 2;
    }


    return 3;

}

/* =========================================================

========================================================= */

async function transitionLoading() {

    redirectCount++;


    const overlay =
        document.getElementById(
            "transitionOverlay"
        );


    const holder =
        document.getElementById(
            "transitionIcon"
        );


    const stickerSlot =
        document.getElementById(
            "stickerSlot"
        );


    stickerSlot.innerHTML =
        "";


    stickerSlot.classList.remove(
        "show"
    );


    /* -----------------------------------------
       RANDOM ICON
    ----------------------------------------- */

    const type =
        random(
            1,
            3
        );


    if (
        type === 1
    ) {

        holder.innerHTML =
            `<div class="icon-spinner"></div>`;

    }

    else if (
        type === 2
    ) {

        holder.innerHTML = `

            <div class="icon-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        `;

    }

    else {

        holder.innerHTML = `

            <div class="icon-squares">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        `;

    }


    /* -----------------------------------------
       STICKER CHANCE
    ----------------------------------------- */

    const canShowSticker =

        redirectCount >=
        STICKER_START_REDIRECT;


    const shouldShowSticker =

        canShowSticker &&

        Math.random() <
        STICKER_CHANCE;


    if (
        shouldShowSticker
    ) {

        const stickerPath =
            getRandomSticker();


        const img =
            document.createElement(
                "img"
            );


        img.src =
            stickerPath;


        img.alt =
            "Random sticker";


        img.onerror =
            function () {

                stickerSlot
                    .classList
                    .remove(
                        "show"
                    );

            };


        stickerSlot.appendChild(
            img
        );


        stickerSlot.classList.add(
            "show"
        );

    }


    /* -----------------------------------------
       SHOW
    ----------------------------------------- */

    overlay.classList.add(
        "active"
    );


    let duration =
        random(
            250,
            550
        );


    /*
    Sticker 出現時停久一點
    */

    if (
        shouldShowSticker
    ) {

        duration =
            random(
                800,
                1200
            );

    }


    await sleep(
        duration
    );


    overlay.classList.remove(
        "active"
    );


    await sleep(
        100
    );


    stickerSlot.classList.remove(
        "show"
    );


    stickerSlot.innerHTML =
        "";

}

function updateProgress(
    type,
    progress
) {


    document

            "[data-percent]"

            el => {

                el.textContent =

    type ===
    "corporate"
) {

    const segments =
        document.querySelectorAll(
            ".segment-loader span"
        );


    const active =
        Math.ceil(
            progress / 10
        );


    segments.forEach(
        (segment,index) => {

            segment.classList.toggle(
                "active",
                index < active
            );

        }
    );

}


/* TERMINAL / BIOS */

if (
    type === "terminal" ||
    type === "bios"
) {

    const ascii =
        document.querySelector(
            "[data-ascii]"
        );


    const length =
        20;


    const filled =
        Math.floor(
            progress /
            100 *
            length
        );


    ascii.textContent =

        "[" +

        "#".repeat(
            filled
        )

        +

        ".".repeat(
            length -
            filled
        )

        +

        "] "

        +

        progress

        +

        "%";

}

/* =========================================================
   IRREGULAR PROGRESS
========================================================= */

async function runProgress(
    type,
    stage
) {


    let progress =
        0;


    while (
        progress <
        100
    ) {


        progress +=
            random(
                4,
                15
            );


        if (
            progress >
            100
        ) {

            progress =
                100;

        }


        /*
        最後一頁故意停在 99%
        */

        if (
            stage ===
            TOTAL_STAGES &&
            progress >= 96 &&
            progress < 100
        ) {

            progress =
                99;

        }


        updateProgress(
            type,
            progress
        );


        let delay =
            random(
                180,
                430
            );


        /*
        一般卡頓
        */

        if (
            Math.random() <
            .30
        ) {

            delay =
                random(
                    650,
                    1350
                );

        }


        /*
        70～95% 更容易卡
        */

        if (
            progress >
            70 &&
            progress <
            96 &&
            Math.random() <
            .25
        ) {

            delay =
                random(
                    900,
                    1700
                );

        }


        /*
        最後一頁 99%
        */

        if (
            stage ===
            TOTAL_STAGES &&
            progress ===
            99
        ) {

            await sleep(
                random(
                    1800,
                    2800
                )
            );


            progress =
                100;


            updateProgress(
                type,
                progress
            );


            break;

        }


        await sleep(
            delay
        );

    }


    await sleep(
        random(
            450,
            850
        )
    );

}


/* =========================================================
   NEXT PAGE
========================================================= */

function nextPageType() {


    if (
        pageQueue.length ===
        0
    ) {

        pageQueue =
            shuffle(
                pageTypes
            );

    }


    return pageQueue.shift();

}


/* =========================================================
   MAIN
========================================================= */

async function run() {


    const app =
        document.getElementById(
            "app"
        );


    for (
        currentStage = 1;

        currentStage <=
        TOTAL_STAGES;

        currentStage++
    ) {


        /*
        第二頁開始才有 Redirecting
        */

        if (
            currentStage >
            1
        ) {

            await transitionLoading();

        }


        const type =
            nextPageType();


        app.innerHTML =
            buildPage(
                type
            );


        applyFunnyContent(
            type,
            currentStage
        );


        updateProgress(
            type,
            0
        );


        await runProgress(
            type,
            currentStage
        );

    }


    await finish();

}
